<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Reproductor de Video | MJ</title>
  <link href="assets/css/style.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/img/MJ_FI.png">
</head>
<body class="bg-black text-white font-sans antialiased min-h-screen">
  
  <!-- Navegación principal -->
  <nav class="border-b border-neutral-800 bg-neutral-950 px-6 py-4 sticky top-0 z-50">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <h1 class="text-2xl font-bold tracking-widest text-red-600 uppercase">
        <a href="index.html">Michael Jackson | <span class="text-white">Archivo musical</span></a>
      </h1>
      <ul class="flex space-x-6 text-sm font-medium text-gray-400">
        <li><a href="index.html" class="hover:text-yellow-600 transition-colors">Inicio</a></li>
        <li><a href="eras.html" class="hover:text-yellow-600 transition-colors">Eras de Grabación</a></li>
        <li><a href="albumes.html" class="hover:text-yellow-600 transition-colors">Álbumes</a></li>
        <li><a href="canciones.html" class="hover:text-yellow-600 transition-colors">Canciones</a></li>
        <li><a href="videos_lista.html" class="text-white border-b border-red-600">Videos</a></li>
      </ul>
    </div>
  </nav>

  <!-- Contenido Principal -->
  <main id="main-content" class="max-w-4xl mx-auto px-6 py-8 flex flex-col items-center">
    <div class="w-full mb-6">
      <a href="videos_lista.html" class="text-xs uppercase tracking-widest text-neutral-400 hover:text-white border border-neutral-800 bg-neutral-950 px-4 py-2 rounded transition-colors inline-block">
        ← Volver al listado
      </a>
    </div>

    <!-- Contenedor del reproductor iframe de YouTube -->
    <div class="w-full aspect-video bg-black rounded border border-neutral-800 overflow-hidden shadow-2xl">
      <iframe id="iframe-video" class="w-full h-full min-h-[400px]"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" referrerpolicy="strict-origin-when-cross-origin"
        allowfullscreen>
      </iframe>
    </div>

    <!-- Bloque de detalles -->
    <div class="w-full bg-neutral-950 border border-neutral-800 rounded p-6 mt-6">
      <h2 id="titulo-cancion" class="text-2xl font-black tracking-wide text-white border-b border-neutral-800 pb-3 mb-4"></h2>
      
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="bg-black/40 p-4 rounded border border-neutral-900">
          <span class="block text-xs uppercase tracking-wider text-neutral-500 mb-1 font-semibold">Álbum Original</span>
          <strong id="nombre-album" class="text-base text-neutral-200 font-medium"></strong>
        </div>
        
        <div class="bg-black/40 p-4 rounded border border-neutral-900">
          <span class="block text-xs uppercase tracking-wider text-neutral-500 mb-1 font-semibold">Era Musical</span>
          <a id="link-era" href="#" class="text-base text-red-500 hover:underline font-medium block"></a>
        </div>
      </div>
    </div>
  </main>

  <footer class="mt-20 border-t border-neutral-800 py-10 text-center text-neutral-600 text-sm">
    <p>&copy; 2026 Michael Jackson Archivo - Para fines educativos</p>
  </footer>

  <!-- Scripts JS Client-side -->
  <script src="data.js"></script>
  <script src="handlers.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const idCancion = urlParams.get('id');

      const detalle = obtenerDetalleVideo(idCancion);

      if (!detalle) {
        document.getElementById('main-content').innerHTML = `
          <div class="py-20 text-center">
            <h1 class="text-2xl font-bold text-red-500 mb-4">Error: El identificador de video no existe.</h1>
            <a href="videos_lista.html" class="text-xs uppercase tracking-widest text-neutral-400 hover:text-white border border-neutral-800 bg-neutral-950 px-4 py-2 rounded">
              ← Volver al listado
            </a>
          </div>`;
        return;
      }

      // Cargar iframe e información
      document.getElementById('page-title').textContent = `${detalle.Cancion.NombreCancion} (Video) | MJ`;
      document.getElementById('iframe-video').src = `https://www.youtube.com/embed/${detalle.Cancion.LinkYTVideo}?autoplay=1&rel=0`;
      document.getElementById('titulo-cancion').textContent = detalle.Cancion.NombreCancion;
      document.getElementById('nombre-album').textContent = detalle.Album.NombreAlbum;
      
      const linkEra = document.getElementById('link-era');
      linkEra.textContent = detalle.Era.NombreEra;
      linkEra.href = `era_detalle.html?id=${detalle.Era.IDEra}`;
    });
  </script>
</body>
</html>
