<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Canciones | MJ</title>
    <link href="assets/css/style.css" rel="stylesheet">
    <link rel="icon" type="image/png" href="assets/img/MJ_FI.png">
</head>

<body class="bg-black text-white font-sans antialiased min-h-screen">

    <!-- Navegación principal -->
    <nav class="border-b border-neutral-800 bg-neutral-950 px-6 py-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold tracking-widest text-red-600 uppercase">
                <a href="index.html">Michael Jackson | <span class="text-white">Archivo musical</span></a>
            </h1>
            <ul class="flex space-x-6 text-sm font-medium text-gray-400">
                <li><a href="index.html" class="hover:text-yellow-600 transition-colors">Inicio</a></li>
                <li><a href="eras.html" class="hover:text-yellow-600 transition-colors">Eras de Grabación</a></li>
                <li><a href="albumes.html" class="hover:text-yellow-600 transition-colors">Álbumes</a></li>
                <li><a href="canciones.html" class="text-white border-b border-red-600">Canciones</a></li>
                <li><a href="videos_lista.html" class="hover:text-yellow-600 transition-colors">Videos</a></li>
            </ul>
        </div>
    </nav>

    <!-- Contenido Principal -->
    <main class="max-w-6xl mx-auto py-12 px-6">
        <div
            class="flex flex-col md:flex-row md:items-center justify-between mb-8 gap-4 border-b border-neutral-800 pb-6">
            <div>
                <h2 class="text-4xl font-extrabold text-white">Repertorio Musical</h2>
                <p class="text-gray-400 text-sm mt-1">Explora las canciones registradas en el archivo solista e inédito.
                </p>
            </div>

            <!-- Buscador y filtro -->
            <div class="flex flex-col sm:flex-row gap-3">
                <input id="input-busqueda" type="text" placeholder="Buscar canción o álbum..."
                    class="bg-neutral-900 border border-neutral-800 text-sm rounded px-4 py-2 text-white focus:outline-none focus:border-red-600 w-full sm:w-64">

                <select id="select-era"
                    class="bg-neutral-900 border border-neutral-800 text-sm rounded px-3 py-2 text-gray-300 focus:outline-none focus:border-red-600">
                    <option value="">Todas las Eras</option>
                    <option value="ERA_00">The Jacksons & Motown</option>
                    <option value="ERA_05">Off the Wall</option>
                    <option value="ERA_06">Thriller</option>
                    <option value="ERA_07">Bad</option>
                    <option value="ERA_08">Dangerous</option>
                    <option value="ERA_09">HIStory</option>
                    <option value="ERA_10">Invincible</option>
                    <option value="ERA_12">Archivos Póstumos</option>
                </select>
            </div>
        </div>

        <!-- Tabla de Canciones -->
        <div class="bg-neutral-900 rounded-xl overflow-hidden border border-neutral-800">
            <table class="w-full text-left">
                <thead class="bg-neutral-800 text-xs uppercase text-gray-400 tracking-wider">
                    <tr>
                        <th class="px-6 py-4">ID</th>
                        <th class="px-6 py-4">Título</th>
                        <th class="px-6 py-4">Álbum</th>
                        <th class="px-6 py-4">Estatus</th>
                        <th class="px-6 py-4 text-right">Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-canciones" class="divide-y divide-neutral-800"></tbody>
            </table>
        </div>

        <p id="contador-canciones" class="mt-6 text-xs text-neutral-500"></p>
    </main>

    <footer class="mt-20 border-t border-neutral-800 py-10 text-center text-neutral-600 text-sm">
        <p>&copy; 2026 Michael Jackson Archivo - Para fines educativos</p>
    </footer>

    <!-- Scripts JS Client-side -->
  <script src="data.js"></script>
  <script src="handlers.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputBusqueda = document.getElementById('input-busqueda');
            const selectEra = document.getElementById('select-era');
            const tabla = document.getElementById('tabla-canciones');
            const contador = document.getElementById('contador-canciones');

            // Cargar eras dinámicamente en el select
            const erasSelect = document.getElementById('select-era');
            obtenerEras().forEach(era => {
                const opt = document.createElement('option');
                opt.value = era.IDEra;
                opt.textContent = era.NombreEra;
                erasSelect.appendChild(opt);
            });

            function renderizarTabla() {
                const canciones = obtenerListaCanciones(inputBusqueda.value, selectEra.value);

                if (!canciones || canciones.length === 0) {
                    tabla.innerHTML = `
            <tr>
              <td colspan="5" class="px-6 py-8 text-center text-neutral-500 font-medium">
                No se encontraron canciones que coincidan con la búsqueda.
              </td>
            </tr>`;
                    contador.textContent = 'Mostrando 0 canciones.';
                    return;
                }

                tabla.innerHTML = canciones.map(c => `
          <tr class="hover:bg-neutral-800/50 transition-colors">
            <td class="px-6 py-4 text-gray-500 font-mono text-xs">${c.IDCancion}</td>
            <td class="px-6 py-4 font-bold text-white flex items-center gap-2">
              ${c.NombreCancion}
              ${c.TieneVideo ? '<span class="text-[10px] bg-red-900/40 text-red-400 px-2 py-0.5 rounded border border-red-800/40 uppercase">Video</span>' : ''}
            </td>
            <td class="px-6 py-4 text-sm text-gray-400">
              <a href="tracklist.html?id=${c.IDAlbum}" class="hover:text-yellow-500 transition-colors">
                ${c.NombreAlbum}
              </a>
            </td>
            <td class="px-6 py-4">
              <span class="px-2.5 py-1 text-xs rounded border ${c.Estatus === 'Lanzada'
                        ? 'bg-neutral-800 text-neutral-300 border-neutral-700'
                        : 'bg-yellow-950/40 text-yellow-500 border-yellow-800/50'
                    }">
                ${c.Estatus}
              </span>
            </td>
            <td class="px-6 py-4 text-right">
              <a href="cancion_detalle.html?id=${c.IDCancion}" class="text-xs font-bold uppercase tracking-wider text-red-500 hover:text-white transition-colors">
                Ver Letra →
              </a>
            </td>
          </tr>
        `).join('');

                contador.textContent = `Mostrando ${canciones.length} canciones encontradas.`;
            }

            // Event listeners para filtrado dinámico
            inputBusqueda.addEventListener('input', renderizarTabla);
            selectEra.addEventListener('change', renderizarTabla);

            // Carga inicial
            renderizarTabla();
        });
    </script>
</body>

</html>
